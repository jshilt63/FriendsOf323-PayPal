<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Committee Login | Friends of 323</title>
  <link rel="stylesheet" href="./assets/auth.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <header class="auth-brand">
        <p class="auth-brand__eyebrow">Friends of 323</p>
        <h1 id="login-title">Committee Portal</h1>
        <p class="auth-description">Sign in to manage or review coffee fundraiser orders.</p>
      </header>
      <form id="login-form" class="auth-form">
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="login-button" class="auth-button" type="submit">Sign in</button>
      </form>
      <p id="login-message" class="auth-message" hidden aria-live="polite"></p>
      <nav class="auth-links" aria-label="Account help">
        <a href="./forgot-password.html">Forgot password?</a>
        <a href="/">Return to store</a>
      </nav>
    </section>
  </main>
  <script type="module" src="./assets/login.js?v=1.9.32"></script>
</body>
</html>
