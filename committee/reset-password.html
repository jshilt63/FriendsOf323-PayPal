<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Friends of 323</title>
  <link rel="stylesheet" href="./assets/auth.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <header class="auth-brand">
        <p class="auth-brand__eyebrow">Friends of 323</p>
        <h1>Reset your password</h1>
        <p class="auth-description">Choose a password containing at least eight characters.</p>
      </header>
      <form id="password-form" class="auth-form">
        <div class="auth-field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
        <div class="auth-field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
        <button id="password-button" class="auth-button" type="submit">Save password</button>
      </form>
      <p id="password-message" class="auth-message" hidden aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="./assets/password-update.js"></script>
</body>
</html>
