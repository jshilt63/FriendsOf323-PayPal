<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | Friends of 323</title>
  <link rel="stylesheet" href="./assets/auth.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="forgot-title">
      <header class="auth-brand">
        <p class="auth-brand__eyebrow">Friends of 323</p>
        <h1 id="forgot-title">Reset your password</h1>
        <p class="auth-description">Enter your portal email address to receive a recovery link.</p>
      </header>
      <form id="forgot-form" class="auth-form">
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button id="forgot-button" class="auth-button" type="submit">Send reset email</button>
      </form>
      <p id="forgot-message" class="auth-message" hidden aria-live="polite"></p>
      <nav class="auth-links"><a href="./login.html">Return to login</a></nav>
    </section>
  </main>
  <script type="module" src="./assets/forgot-password.js"></script>
</body>
</html>
